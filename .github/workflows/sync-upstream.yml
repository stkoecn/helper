name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream (Prometheus-first/helper)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST /repos/$GITHUB_REPOSITORY/merge-upstream -f branch=main
